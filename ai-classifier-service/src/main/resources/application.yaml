spring:
  application:
    name: ai-classifier-service

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: ai-classifier-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        # Not actively enforced while use.type.headers=false (no header-derived class
        # name to check), but kept as a documented allowlist in case that ever changes.
        spring.json.trusted.packages: com.ikdev.customersupportrouter.aiclassifierservice.event
        spring.json.value.default.type: com.ikdev.customersupportrouter.aiclassifierservice.event.MessageEvent
        spring.json.use.type.headers: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
      connect-timeout: 2s

  ai:
    model:
      chat: none
      audio:
        speech: none
        transcription: none
      embedding: none
      image: none
      moderation: none

    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: "https://integrate.api.nvidia.com/v1"
      chat:
        model: z-ai/glm-5.2

    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5-coder:1.5b-instruct

server:
  port: 8083

conversation:
  memory:
    size: 10
    enabled: true

llm:
  provider: ollama
  timeout: 60s
  prompt:
    default: |
      Classify the following customer message.

      Determine:
      - intent
      - sentiment
      - urgency

      Prior conversation context (oldest first):
      {context}

      Return the classification fields only.

      Message:
      {message}
