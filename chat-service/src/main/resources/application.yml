spring:
  application:
    name: chat-service
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:supportdb}
    username: ${POSTGRES_USER:user}
    password: ${POSTGRES_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8081