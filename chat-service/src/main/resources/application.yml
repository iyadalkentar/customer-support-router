spring:
  application:
    name: chat-service
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:supportdb}
    username: ${POSTGRES_USER:user}
    password: ${POSTGRES_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      # Lettuce's default connect timeout is 60s; a dead Redis must not stall the
      # AFTER_COMMIT callback (and thus the POST response) for that long.
      timeout: 2s
      connect-timeout: 2s
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: chat-classification-results-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.ikdev.customersupportrouter.chatservice.event
        # chat-service listens only on classification-results now (incoming-messages is
        # owned by ai-classifier-service). The default type tells the deserializer
        # which record shape to land on when no type header is present.
        spring.json.value.default.type: com.ikdev.customersupportrouter.chatservice.event.ClassificationResult
        spring.json.use.type.headers: false
server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health
  prometheus:
    metrics:
      export:
        enabled: true

conversation:
  memory:
    size: 10
    ttl: 24h
    enabled: true