name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  changes:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      chat-service: ${{ steps.filter.outputs['chat-service'] }}
      ai-classifier-service: ${{ steps.filter.outputs['ai-classifier-service'] }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: path-filters
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: filter
        run: |
          for key in chat-service ai-classifier-service frontend shared; do
            value=$(jq -r --arg k "$key" '.[$k]' filters.json)
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

  publish:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [chat-service, ai-classifier-service, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - if: needs.changes.outputs[matrix.service] == 'true' || needs.changes.outputs.shared == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - if: needs.changes.outputs[matrix.service] == 'true' || needs.changes.outputs.shared == 'true'
        uses: docker/setup-buildx-action@v3
      - if: needs.changes.outputs[matrix.service] == 'true' || needs.changes.outputs.shared == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: needs.changes.outputs[matrix.service] == 'true' || needs.changes.outputs.shared == 'true'
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - if: needs.changes.outputs[matrix.service] == 'true' || needs.changes.outputs.shared == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
